<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Preload Critical Assets -->
    <link rel="preload" as="image" href="/images/riwaaz-logo.png" />
    <link rel="preload" as="image" href="/images/DSC4621_1.jpg" />
    
    <!-- Google Fonts: Cormorant Garamond & Jost -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />
    
    <title>RIWAAZ by Jiya — Where timeless craft finds a modern soul.</title>
    <meta
      name="description"
      content="RIWAAZ by Jiya — Where timeless craft finds a modern soul. A curated capsule of handcrafted Indian juttis in 100% genuine leather with handmade embroidery."
    />
    <meta property="og:site_name" content="RIWAAZ by Jiya" />
    <meta property="og:title" content="RIWAAZ by Jiya — Where timeless craft finds a modern soul." />
    <meta
      property="og:description"
      content="Handcrafted juttis in 100% genuine leather with handmade embroidery. Where timeless craft finds a modern soul."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1f1615" />
  </head>
  <body class="bg-ivory text-ink selection:bg-gold selection:text-ink antialiased">
    <div id="root">
      <div id="file-protocol-notice" style="display:none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: #1f1615; color: #fbf7ee; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;">
        <div style="max-width: 520px; border: 1px solid rgba(201,168,106,0.4); border-radius: 16px; padding: 40px; background: rgba(31,22,21,0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.6);">
          <div style="font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #c9a86a; margin-bottom: 16px;">✦ RIWAAZ by Jiya ✦</div>
          <h1 style="font-size: 26px; font-weight: 400; margin-bottom: 12px; color: #fbf7ee;">Opening Live Website...</h1>
          <p style="font-size: 14px; color: #c4b5a5; line-height: 1.6; margin-bottom: 24px;">
            React applications run via the local development server. Redirecting you automatically to <strong>localhost:3001</strong>.
          </p>
          <a href="http://localhost:3001" style="display: inline-block; padding: 14px 32px; background: #5b1e28; color: #fbf7ee; border: 1px solid #c9a86a; text-decoration: none; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border-radius: 8px; font-weight: 500;">
            Open Website Now →
          </a>
        </div>
      </div>
      <script>
        if (window.location.protocol === 'file:') {
          document.getElementById('file-protocol-notice').style.display = 'flex';
          window.location.replace('http://localhost:3001');
        }
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
